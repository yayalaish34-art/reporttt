# Deploy the Next.js app to Railway on every push to main.
#
# Setup (one-time):
#   1. Railway dashboard → the reporttt project → Settings → Tokens → "Create Token"
#      → copy the project token.
#   2. GitHub repo → Settings → Secrets and variables → Actions → "New repository secret"
#      → Name: RAILWAY_TOKEN · Value: the token from step 1.
#
# If your Railway service isn't named "web", change the `--service` flag below.
# Find the exact service name in: Railway dashboard → project → service page title.

name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual re-deploy from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (service: web)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service web --ci
